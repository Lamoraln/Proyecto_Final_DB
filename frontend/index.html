<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario | DistribuRed</title>
<link rel="stylesheet" href="./src/app/styles.css">
<link rel="stylesheet" href="./src/app/navegacion.css">
<link rel="stylesheet" href="./src/app/acceso.css">
<script type="module" src="./src/app/navegacion.js"></script>
</head>
<body class="layout-navegacion">
  <aside class="sidebar" id="barra-lateral" hidden></aside>
<div class="workspace">
  <header class="top"><span>Operaciones <b>/</b> Inventario</span><span class="avatar" aria-label="Perfil de usuario">DR</span></header>
  <main hidden>
    <section class="hero">
      <div><h1>Inventario por sede</h1><p>Consulta existencias y detecta productos que necesitan reposición.</p></div>
      <label>Sede operativa<select id="sede"></select></label>
    </section>
    <section class="cards" aria-label="Resumen de inventario" id="resumen"></section>
    <section class="panel" aria-labelledby="titulo-tabla">
      <div class="panel-title"><h2>Productos</h2><span role="status" id="conteo"></span></div>
      <form class="filters" id="filtros">
        <label class="search">Buscar producto<input id="buscar" type="search" placeholder="Nombre, SKU o categoría"></label>
        <label>Estado<select id="estado"><option value="">Todos los estados</option></select></label>
        <button type="reset">Limpiar filtros</button>
      </form>
      <div class="table-wrap" role="region" aria-labelledby="titulo-tabla" tabindex="0">
        <table><thead><tr><th>Producto</th><th>Categoría</th><th>Almacén</th><th class="number">Existencia</th><th class="number">Mínimo</th><th>Estado</th></tr></thead><tbody id="filas"></tbody></table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
