<!doctype html>
<html lang="es-CO">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio de sesión | DistribuRed</title>
    <link rel="stylesheet" href="./src/app/styles.css">
    <link rel="stylesheet" href="./src/app/acceso.css">
    <script type="module" src="./src/app/login.js"></script>
</head>

<body class="pagina-login">
    <main class="login-panel">
        <span class="logo" aria-hidden="true">◆</span>
        <h1>DistribuRed</h1>
        <p>Ingresa con tu cuenta de DistribuRed.</p>
        <form id="login-form">
            <label for="usuario">Usuario</label>
            <input id="usuario" autocomplete="username" maxlength="50" required>
            <label for="contrasena">Contraseña</label>
            <input id="contrasena" type="password" autocomplete="current-password" maxlength="256" required>
            <button type="submit">Iniciar sesión</button>
            <p id="login-mensaje" role="alert"></p>
        </form>
    </main>
</body>

</html>
