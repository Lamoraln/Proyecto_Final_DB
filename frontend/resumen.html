<!doctype html>
<html lang="es-CO">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumen multisede | DistribuRed</title>
    <link rel="stylesheet" href="./src/app/styles.css">
    <link rel="stylesheet" href="./src/app/navegacion.css">
    <link rel="stylesheet" href="./src/app/acceso.css">
    <script type="module" src="./src/app/navegacion.js"></script>
</head>

<body class="layout-navegacion">
    <aside class="sidebar" id="barra-lateral" hidden></aside>

    <div class="workspace">
        <header class="top">
            <span>Operaciones <b>/</b> Resumen multisede</span>
            <span class="avatar" aria-label="Perfil de demostración">DR</span>
        </header>
        <main hidden>
            <section class="hero">
                <div>
                    <h1>Resumen multisede</h1>
                    <p>Identifica dónde hay agotados y qué sedes necesitan reposición.</p>
                </div>
            </section>

            <section class="cards" id="indicadores" aria-label="Indicadores multisede">
            </section>

            <section class="panel" aria-labelledby="titulo-sedes">
                <div class="panel-title">
                    <h2 id="titulo-sedes">Inventario por sede</h2>
                    <span id="estado-resumen" role="status">Cargando inventario…</span>
                </div>

                <div class="table-wrap" role="region" aria-labelledby="titulo-sedes" tabindex="0">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Sede</th>
                                <th scope="col" class="number">Unidades</th>
                                <th scope="col" class="number">Bajo mínimo</th>
                                <th scope="col" class="number">Agotadas</th>
                                <th scope="col" class="number">Sin registro</th>
                                <th scope="col">Detalle</th>
                            </tr>
                        </thead>
                        <tbody id="filas-sedes"></tbody>
                    </table>
                </div>
            </section>
            <section class="panel" id="consolidado-corporativo" aria-labelledby="titulo-consolidado">
                <div class="panel-title">
                    <h2 id="titulo-consolidado">Consolidado operativo por sede</h2>
                </div>
                <div id="tabla-consolidado">
                    <p class="empty" role="status">Cargando consolidado…</p>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
